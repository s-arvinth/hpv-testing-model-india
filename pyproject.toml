[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hpvcc"
version = "1.0.0"
description = "Compartmental model of HPV infection, HPV testing and cervical cancer in India and its states and Union Territories"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["HPV", "cervical cancer", "screening", "compartmental model", "India", "epidemiology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
maps = ["geopandas>=0.14"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/s-arvinth/hpv-testing-model-india"

[project.scripts]
hpvcc = "hpvcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: regenerates the paper's ensembles and tables (minutes)"]
